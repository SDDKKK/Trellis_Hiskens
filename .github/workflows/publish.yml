name: Publish to npm

# HISKENS OVERLAY — automatic triggers are DISABLED.
#
# Upstream fires this on a published GitHub Release or a raw `v*` tag push.
# That model assumes core and cli share one version. This fork pins
# `@mindfoldhq/trellis-core` to upstream's exact version while the CLI
# carries `{upstream}-hiskens`, so every version-parity gate in
# release-preflight.js fails here (check-versions, verify-packed-cli,
# publish-plan, verify-npm), and bump-versions.js would rewrite core off
# its pinned version. A stray `v*` tag push would therefore either dead-end
# or corrupt the core version.
#
# Publishing goes through the `trellis-publish` skill (manual
# `pnpm publish` from packages/cli). This workflow is kept only so the
# steps stay visible/diffable against upstream; run it by hand if you have
# first fixed the preflight scripts for the fork's version model.
on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version alignment (core, cli, git tag)
        run: node packages/cli/scripts/release-preflight.js check-versions --require-tag

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      # Build before test: integration tests spawn the real CLI via
      # bin/trellis.js, which imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli)
        run: pnpm test

      - name: Verify packed CLI pins core to exact version
        run: node packages/cli/scripts/release-preflight.js verify-packed-cli

      - name: Compute publish plan
        id: plan
        run: node packages/cli/scripts/release-preflight.js publish-plan --github

      - name: Publish @mindfoldhq/trellis-core
        if: steps.plan.outputs.core_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Skip @mindfoldhq/trellis-core (already on npm)
        if: steps.plan.outputs.core_publish != 'true'
        run: echo "@mindfoldhq/trellis-core@${{ steps.plan.outputs.version }} already published; skipping."

      - name: Publish @mindfoldhq/trellis
        if: steps.plan.outputs.cli_publish == 'true'
        run: pnpm publish --access public --no-git-checks --tag ${{ steps.plan.outputs.tag }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Skip @mindfoldhq/trellis (already on npm)
        if: steps.plan.outputs.cli_publish != 'true'
        run: echo "@mindfoldhq/trellis@${{ steps.plan.outputs.version }} already published; skipping."

      - name: Verify published packages on public npm
        run: node packages/cli/scripts/release-preflight.js verify-npm --package all
